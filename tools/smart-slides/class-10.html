<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FF6B35">
  <title>Class 10 — Smart Slides</title>
  <link rel="icon" href="../../favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --orange: #FF6B35;
      --orange-dark: #E85524;
      --orange-light: #FF8C42;
      --orange-soft: #FFF0E8;
      --navy: #0A2540;
      --bg: #FFF0E8;
      --card: #FFFFFF;
      --border: #F5D5C0;
      --text: #0F172A;
      --text-soft: #64748B;
      --font: 'Plus Jakarta Sans', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
    }

    .container { max-width: 900px; margin: 0 auto; }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 18px;
      background: white;
      border: 1.5px solid var(--border);
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-soft);
      text-decoration: none;
      margin-bottom: 24px;
      transition: all 0.2s;
    }

    .back-btn:hover {
      border-color: var(--orange);
      color: var(--orange);
      transform: translateX(-3px);
    }

    .hero {
      text-align: center;
      padding: 20px 0 40px;
    }

    .hero-icon {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, var(--teal), var(--teal-light)); 
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      margin: 0 auto 16px;
      box-shadow: 0 8px 24px rgba(10, 37, 64, 0.3);
    }

    .hero h1 {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 8px;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    .hero p {
      font-size: 15px;
      color: var(--text-soft);
    }

    .chapters-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    @media (min-width: 600px) {
      .chapters-grid { grid-template-columns: repeat(2, 1fr); }
    }

    .chapter-card {
      background: white;
      border: 1.5px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      text-decoration: none;
      color: inherit;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: all 0.25s;
    }

    .chapter-card:hover {
      transform: translateY(-3px);
      border-color: var(--orange);
      box-shadow: 0 12px 24px rgba(255, 107, 53, 0.15);
    }

    .chapter-num {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: var(--orange-soft);
      color: var(--orange);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 800;
      flex-shrink: 0;
    }

    .chapter-info { flex: 1; }

    .chapter-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 3px;
      line-height: 1.3;
    }

    .chapter-meta {
      font-size: 12px;
      color: var(--text-soft);
      font-weight: 500;
    }

    .chapter-arrow {
      color: var(--orange);
      font-size: 18px;
      font-weight: 700;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-soft);
      grid-column: 1/-1;
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .footer {
      text-align: center;
      padding: 40px 0 20px;
      font-size: 13px;
      color: var(--text-soft);
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="../smart-slides.html" class="back-btn">← Back to Classes</a>

    <div class="hero">
      <div class="hero-icon">🔟</div>
      <h1>Class 10</h1>
      <p>Choose a chapter to present</p>
    </div>

    <div class="chapters-grid" id="chaptersGrid">
      <!-- Chapters loaded from JSON -->
    </div>

    <div class="footer">
      © 2026 Teacher's Tools · Akash Srivastva
    </div>
  </div>

  <script>
    const CLASS_ID = 10;

    async function loadChapters() {
      try {
        const response = await fetch('../../data/chapters.json');
        const data = await response.json();
        const classData = data.classes.find(c => c.id === CLASS_ID);
        
        if (!classData) {
          renderEmpty('Class not found');
          return;
        }

        renderChapters(classData.chapters);
      } catch (error) {
        console.error('Error:', error);
        renderEmpty('Could not load chapters');
      }
    }

    function renderChapters(chapters) {
      const grid = document.getElementById('chaptersGrid');
      
      if (!chapters || chapters.length === 0) {
        renderEmpty('No chapters available yet');
        return;
      }

      grid.innerHTML = chapters.map(ch => `
        <a href="../viewer.html?class=${CLASS_ID}&chapter=${ch.id}" class="chapter-card">
          <div class="chapter-num">${String(ch.id).padStart(2, '0')}</div>
          <div class="chapter-info">
            <div class="chapter-name">${ch.name}</div>
            <div class="chapter-meta">Chapter ${ch.id}</div>
          </div>
          <div class="chapter-arrow">→</div>
        </a>
      `).join('');
    }

    function renderEmpty(msg) {
      document.getElementById('chaptersGrid').innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">📖</div>
          <p>${msg}</p>
        </div>
      `;
    }

    loadChapters();
  </script>
</body>
</html>
