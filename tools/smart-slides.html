<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FF6B35">
  <title>Smart Slides — Teacher's Tools</title>
  <link rel="icon" href="../favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --orange: #FF6B35;
      --orange-light: #FF8C42;
      --orange-soft: #FFF0E8;
      --bg: #FFF0E8;
      --border: #F5D5C0;
      --text: #0F172A;
      --text-soft: #64748B;
      --font: 'Plus Jakarta Sans', sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    .back-btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 18px; background: white; border: 1.5px solid var(--border); border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--text-soft); text-decoration: none; margin-bottom: 24px; transition: all 0.2s; }
    .back-btn:hover { border-color: var(--orange); color: var(--orange); transform: translateX(-3px); }
    .hero { text-align: center; padding: 20px 0 40px; }
    .hero-icon { width: 72px; height: 72px; background: linear-gradient(135deg, var(--orange), var(--orange-light)); border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 36px; margin: 0 auto 16px; box-shadow: 0 8px 24px rgba(255, 107, 53, 0.35); }
    .hero h1 { font-size: 32px; font-weight: 800; margin-bottom: 8px; letter-spacing: -0.02em; }
    .hero p { font-size: 15px; color: var(--text-soft); }
    .classes-grid { display: grid; grid-template-columns: 1fr; gap: 16px; margin-top: 20px; }
    @media (min-width: 600px) { .classes-grid { grid-template-columns: repeat(2, 1fr); } }
    .class-card { background: white; border: 1.5px solid var(--border); border-radius: 20px; padding: 24px; text-decoration: none; color: inherit; display: flex; align-items: center; gap: 18px; transition: all 0.25s; }
    .class-card:hover { transform: translateY(-4px); border-color: var(--orange); box-shadow: 0 16px 32px rgba(255, 107, 53, 0.15); }
    .class-icon { width: 60px; height: 60px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 28px; flex-shrink: 0; background: var(--orange-soft); }
    .class-info { flex: 1; }
    .class-name { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
    .class-meta { font-size: 13px; color: var(--text-soft); font-weight: 500; }
    .class-arrow { font-size: 20px; color: var(--orange); font-weight: 700; }
    .footer { text-align: center; padding: 40px 0 20px; font-size: 13px; color: var(--text-soft); }
  </style>
</head>
<body>
  <div class="container">
    <a href="../index.html" class="back-btn">← Back to Dashboard</a>
    <div class="hero">
      <div class="hero-icon">📊</div>
      <h1>Smart Slides</h1>
      <p>Choose a class to start presenting</p>
    </div>
    <div class="classes-grid" id="classesGrid"></div>
    <div class="footer">© 2026 Teacher's Tools · Akash Srivastva</div>
  </div>
  <script>
    async function loadClasses() {
      try {
        const response = await fetch('../data/chapters.json');
        const data = await response.json();
        renderClasses(data.classes);
      } catch (error) { console.error('Error:', error); }
    }
    function renderClasses(classes) {
      const grid = document.getElementById('classesGrid');
      grid.innerHTML = classes.map(cls => `
        <a href="smart-slides/class-${cls.id}.html" class="class-card">
          <div class="class-icon" style="background: ${cls.color}15;">${cls.icon}</div>
          <div class="class-info">
            <div class="class-name">${cls.name}</div>
            <div class="class-meta">${cls.chapters.length} chapter${cls.chapters.length !== 1 ? 's' : ''}</div>
          </div>
          <div class="class-arrow">→</div>
        </a>
      `).join('');
    }
    loadClasses();
  </script>
</body>
</html>
