<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0A2540">
  <title>Smart Slides Viewer — Teacher's Tools</title>
  <link rel="icon" href="../favicon.ico">

  <!-- PDF.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    :root {
      --orange: #FF6B35;
      --orange-dark: #E85524;
      --orange-soft: #FFF0E8;
      --navy: #0A2540;
      --bg-dark: #121019;
      --slide-scale: 1;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-dark);
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      -webkit-user-select: none;
      user-select: none;
      overscroll-behavior: none;
    }

    /* ============================================
       16:9 VIEWPORT
       ============================================ */
    .presentation-viewport {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(var(--slide-scale));
      width: 177.78vh;
      height: 100vh;
      max-height: 56.25vw;
      max-width: 100vw;
      background-color: #FFF4E9;
      border: 1px solid rgba(255, 255, 255, 0.12);
      overflow: hidden;
      z-index: 10;
    }

    #pdfCanvas {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      max-width: 100%;
      max-height: 100%;
      display: block;
    }

    #drawCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 40;
      cursor: crosshair;
      pointer-events: none;
      touch-action: none;
    }

    #drawCanvas.active-interactive { pointer-events: auto; }
/* Landscape rotation for mobile fullscreen */
@media (max-width: 768px) and (orientation: portrait) {
  body.fullscreen-active .presentation-viewport {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(90deg) scale(var(--slide-scale));
    transform-origin: center center;
    width: 100vh;
    height: 100vw;
    max-width: 100vh;
    max-height: 100vw;
  }

  body.fullscreen-active .stylus-toolbar {
    transform: rotate(90deg);
    transform-origin: center center;
    right: -20px;
  }

  body.fullscreen-active .hud-controls {
    transform: rotate(90deg) translateX(-50%);
    transform-origin: center center;
    bottom: 20px;
  }

  body.fullscreen-active .back-btn,
  body.fullscreen-active .top-actions {
    display: none;
  }
}
    /* Loading spinner */
    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: var(--orange);
      font-size: 14px;
      font-weight: 600;
      z-index: 20;
    }

    .loading::after {
      content: '';
      display: block;
      width: 40px;
      height: 40px;
      margin: 16px auto 0;
      border: 3px solid rgba(255, 107, 53, 0.2);
      border-top-color: var(--orange);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ============================================
       TOP-LEFT: CHAPTER HUB BUTTON
       ============================================ */
    .back-btn {
      position: fixed;
      top: 15px;
      left: 18px;
      z-index: 70;
      background: rgba(34, 28, 51, 0.92);
      backdrop-filter: blur(10px);
      color: #FFFFFF;
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      background: var(--orange);
      border-color: var(--orange);
      transform: translateY(-2px);
    }

    /* ============================================
       TOP-RIGHT: DOWNLOAD & UNDO/REDO
       ============================================ */
    .top-actions {
      position: fixed;
      top: 15px;
      right: 18px;
      z-index: 70;
      display: flex;
      gap: 8px;
    }

    .top-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: rgba(34, 28, 51, 0.92);
      backdrop-filter: blur(10px);
      color: white;
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .top-btn:hover {
      background: var(--orange);
      border-color: var(--orange);
    }

    .top-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .top-btn:disabled:hover {
      background: rgba(34, 28, 51, 0.92);
      border-color: rgba(255, 255, 255, 0.25);
    }

    /* ============================================
       RIGHT SIDE VERTICAL DOCK (STYLUS TOOLS)
       ============================================ */
    .stylus-toolbar {
      position: fixed;
      top: 50%;
      right: 14px;
      transform: translateY(-50%);
      z-index: 65;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      background: rgba(34, 28, 51, 0.95);
      backdrop-filter: blur(10px);
      padding: 10px 8px;
      border-radius: 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid rgba(255, 255, 255, 0.15);
      max-height: 95vh;
      overflow-y: auto;
    }

    .tool-btn {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      border: 1px solid rgba(255,255,255,0.2);
      background: transparent;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .tool-btn:hover {
      background: rgba(244, 113, 75, 0.85);
      border-color: transparent;
    }

    .tool-btn.active {
      background: var(--orange);
      border-color: var(--orange);
      box-shadow: 0 0 12px rgba(244, 113, 75, 0.7);
    }

    .divider {
      width: 24px;
      height: 1px;
      background: rgba(255, 255, 255, 0.2);
      margin: 4px 0;
      flex-shrink: 0;
    }

    .color-swatch {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid white;
      transition: transform 0.15s ease;
      flex-shrink: 0;
    }

    .color-swatch:hover {
      transform: scale(1.2);
    }

    .color-swatch.active {
      transform: scale(1.3);
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
    }

    /* ============================================
       BOTTOM HUD CONTROLS
       ============================================ */
    .hud-controls {
  position: fixed;
  bottom: 15px;
  left: 25%;
  transform: translateX(-50%);
  z-index: 60;
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(34, 28, 51, 0.95);
  backdrop-filter: blur(10px);
  padding: 6px 18px;
  border-radius: 9999px;
  color: white;
  box-shadow: 0 10px 30px rgba(0,0,0,0.45);
  border: 1px solid rgba(255, 255, 255, 0.15);
}

    .hud-btn {
      background: transparent;
      border: none;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 8px;
      transition: background 0.15s;
    }

    .hud-btn:hover {
      background: rgba(244, 113, 75, 0.85);
    }

    .hud-counter {
      font-size: 12px;
      font-family: 'Courier New', monospace;
      font-weight: 700;
      padding: 0 10px;
      min-width: 70px;
      text-align: center;
    }

    .hud-divider {
      width: 1px;
      height: 16px;
      background: rgba(255,255,255,0.3);
      margin: 0 4px;
    }

    /* ============================================
       MOBILE OPTIMIZATION
       ============================================ */
    @media (max-width: 768px) {
      .stylus-toolbar {
        right: 8px;
        padding: 6px 5px;
        gap: 4px;
      }

      .tool-btn {
        width: 30px;
        height: 30px;
        font-size: 14px;
      }

      .color-swatch {
        width: 16px;
        height: 16px;
      }

      .back-btn {
        top: 10px;
        left: 10px;
        padding: 6px 12px;
        font-size: 11px;
      }

      .top-actions {
        top: 10px;
        right: 10px;
        gap: 6px;
      }

      .top-btn {
        width: 36px;
        height: 36px;
        font-size: 16px;
      }

      .hud-controls {
  bottom: 10px;
  left: 50%;
  padding: 4px 12px;
  gap: 4px;
}

      .hud-btn {
        padding: 6px 10px;
        font-size: 14px;
      }

      .hud-counter {
        font-size: 11px;
        min-width: 60px;
        padding: 0 6px;
      }
    }

    /* Hide scrollbars */
    ::-webkit-scrollbar { width: 0; height: 0; }
  </style>
</head>
<body>

  <!-- TOP-LEFT: BACK BUTTON -->
  <a href="#" id="backBtn" class="back-btn">
    <span>←</span>
    <span id="backLabel">Back</span>
  </a>

  <!-- TOP-RIGHT: DOWNLOAD, UNDO, REDO -->
  <div class="top-actions">
    <button class="top-btn" id="btnUndo" title="Undo (Ctrl+Z)" disabled>↶</button>
    <button class="top-btn" id="btnRedo" title="Redo (Ctrl+Y)" disabled>↷</button>
    <button class="top-btn" id="btnDownload" title="Download PNG">⬇</button>
  </div>

  <!-- RIGHT SIDE: STYLUS TOOLS -->
  <div class="stylus-toolbar" id="stylusToolbar">
    <button class="tool-btn" id="btnZoomIn" title="Zoom In">🔍+</button>
    <button class="tool-btn" id="btnZoomOut" title="Zoom Out">🔍−</button>

    <div class="divider"></div>

    <button class="tool-btn" id="btnPen" title="Pen">✏️</button>
    <button class="tool-btn" id="btnHighlighter" title="Highlighter">🖍️</button>

    <div class="divider"></div>

    <button class="tool-btn" id="btnLine" title="Line">📏</button>
    <button class="tool-btn" id="btnRect" title="Rectangle">⬜</button>
    <button class="tool-btn" id="btnCircle" title="Circle">⭕</button>
    <button class="tool-btn" id="btnTriangle" title="Triangle">🔺</button>

    <div class="divider"></div>

    <button class="tool-btn" id="btnEraser" title="Eraser">🧹</button>

    <div class="divider"></div>

    <div class="color-swatch active" style="background: #E85C5C" data-color="#E85C5C" title="Red"></div>
    <div class="color-swatch" style="background: #2F80ED" data-color="#2F80ED" title="Blue"></div>
    <div class="color-swatch" style="background: #27AE60" data-color="#27AE60" title="Green"></div>
    <div class="color-swatch" style="background: #F4714B" data-color="#F4714B" title="Coral"></div>
    <div class="color-swatch" style="background: #221C33" data-color="#221C33" title="Black"></div>
<div class="color-swatch" style="background: #FFD93D" data-color="#FFD93D" title="Yellow"></div>
<div class="color-swatch" style="background: #FFFFFF" data-color="#FFFFFF" title="White"></div>

    <div class="divider"></div>

    <button class="tool-btn" id="btnClear" title="Clear Slide">🗑️</button>
  </div>

  <!-- PDF VIEWPORT -->
  <div class="presentation-viewport" id="viewport">
    <canvas id="pdfCanvas"></canvas>
    <canvas id="drawCanvas"></canvas>
    <div class="loading" id="loading">Loading PDF...</div>
  </div>

  <!-- BOTTOM HUD -->
  <div class="hud-controls">
    <button class="hud-btn" id="btnPrev" title="Previous">◀</button>
    <span class="hud-counter" id="hudCounter">01 / 01</span>
    <button class="hud-btn" id="btnNext" title="Next">▶</button>
    <div class="hud-divider"></div>
    <button class="hud-btn" id="btnFullscreen" title="Fullscreen">⛶</button>
  </div>

  <script>
/* ============================================================
   SMART SLIDES VIEWER — Main Logic
   ============================================================ */

// ============================================================
// CONFIG
// ============================================================
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// URL Parameters
const params = new URLSearchParams(window.location.search);
const classId = params.get('class') || '9';
const chapterId = params.get('chapter') || '1';

// ============================================================
// STATE
// ============================================================
let pdfDoc = null;
let currentPage = 1;
let totalPages = 0;
let currentZoom = 1.0;
let currentTool = 'none';
let currentColor = '#E85C5C';
let isDrawing = false;
let startX = 0, startY = 0;
let snapshot = null;

// Per-slide drawings (base64 images)
const slideDrawings = {};
// Per-slide undo/redo history
const slideHistory = {};
// PDF file path (from JSON)
let pdfPath = '';

// ============================================================
// DOM ELEMENTS
// ============================================================
const pdfCanvas = document.getElementById('pdfCanvas');
const pdfCtx = pdfCanvas.getContext('2d');
const drawCanvas = document.getElementById('drawCanvas');
const ctx = drawCanvas.getContext('2d');
const viewport = document.getElementById('viewport');
const loading = document.getElementById('loading');
const hudCounter = document.getElementById('hudCounter');
const backBtn = document.getElementById('backBtn');
const backLabel = document.getElementById('backLabel');

// ============================================================
// LOAD CHAPTER DATA & PDF
// ============================================================
async function init() {
  try {
    // Load chapters.json
    const response = await fetch('../data/chapters.json');
    const data = await response.json();

    const classData = data.classes.find(c => c.id === parseInt(classId));
    if (!classData) {
      showError('Class not found');
      return;
    }

    const chapterData = classData.chapters.find(c => c.id === parseInt(chapterId));
    if (!chapterData) {
      showError('Chapter not found');
      return;
    }

    pdfPath = chapterData.pdf;

    // Update back button
    backBtn.href = `smart-slides/class-${classId}.html`;
    backLabel.textContent = `Class ${classId} · Ch ${chapterId}`;

    // Update page title
    document.title = `${chapterData.name} — Smart Slides`;

    // Load PDF
    await loadPDF(pdfPath);
  } catch (error) {
    console.error('Init error:', error);
    showError('Could not load PDF');
  }
}

async function loadPDF(url) {
  try {
    loading.style.display = 'block';
    const loadingTask = pdfjsLib.getDocument(url);
    pdfDoc = await loadingTask.promise;
    totalPages = pdfDoc.numPages;

    // Hide loading
    loading.style.display = 'none';

    // Resize canvases
    resizeCanvases();

    // Render first page
    await renderPage(1);
    updateCounter();

  } catch (error) {
    console.error('PDF load error:', error);
    showError('Could not load PDF. Check file path.');
  }
}

function showError(msg) {
  loading.style.display = 'block';
  loading.textContent = '⚠️ ' + msg;
  loading.style.animation = 'none';
}

// ============================================================
// RENDER PDF PAGE
// ============================================================
async function renderPage(pageNum) {
  if (!pdfDoc) return;
  if (pageNum < 1) pageNum = 1;
  if (pageNum > totalPages) pageNum = totalPages;

  const page = await pdfDoc.getPage(pageNum);
  const viewport16by9 = viewport.getBoundingClientRect();
  const pixelRatio = window.devicePixelRatio || 1;

  // Base scale to fit 16:9 viewport
  const baseViewport = page.getViewport({ scale: 1 });
  const scaleX = viewport16by9.width / baseViewport.width;
  const scaleY = viewport16by9.height / baseViewport.height;
  const scale = Math.min(scaleX, scaleY) * pixelRatio;

  const scaledViewport = page.getViewport({ scale });

  pdfCanvas.width = scaledViewport.width;
  pdfCanvas.height = scaledViewport.height;

  const renderContext = {
    canvasContext: pdfCtx,
    viewport: scaledViewport
  };

  await page.render(renderContext).promise;

  currentPage = pageNum;

  // Resize draw canvas to match
  resizeCanvases();
  // Restore drawings for this page
  restoreSlideCanvas(currentPage);
  updateCounter();
}

// ============================================================
// RESIZE CANVASES
// ============================================================
function resizeCanvases() {
  const rect = viewport.getBoundingClientRect();
  drawCanvas.width = rect.width;
  drawCanvas.height = rect.height;
  // Redraw existing drawings for current slide
  restoreSlideCanvas(currentPage);
}

window.addEventListener('resize', () => {
  resizeCanvases();
  if (pdfDoc) renderPage(currentPage);
});

// ============================================================
// NAVIGATION
// ============================================================
function nextSlide() {
  if (currentPage < totalPages) {
    saveSlideCanvas(currentPage);
    renderPage(currentPage + 1);
  }
}

function prevSlide() {
  if (currentPage > 1) {
    saveSlideCanvas(currentPage);
    renderPage(currentPage - 1);
  }
}

function updateCounter() {
  const cur = String(currentPage).padStart(2, '0');
  const tot = String(totalPages).padStart(2, '0');
  hudCounter.textContent = `${cur} / ${tot}`;
}

document.getElementById('btnPrev').addEventListener('click', (e) => {
  e.stopPropagation();
  prevSlide();
});

document.getElementById('btnNext').addEventListener('click', (e) => {
  e.stopPropagation();
  nextSlide();
});

// Click on viewport to navigate (only when no tool active)
viewport.addEventListener('click', (e) => {
  if (currentTool !== 'none') return;
  if (e.target.closest('.stylus-toolbar') || e.target.closest('.hud-controls')) return;

  const rect = viewport.getBoundingClientRect();
  const clickX = e.clientX - rect.left;
  if (clickX < rect.width / 2) {
    prevSlide();
  } else {
    nextSlide();
  }
});

// Keyboard
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
    e.preventDefault();
    nextSlide();
  } else if (e.key === 'ArrowLeft' || e.key === 'PageUp' || e.key === 'Backspace') {
    e.preventDefault();
    prevSlide();
  } else if (e.key === 'f' || e.key === 'F') {
    toggleFullscreen();
  } else if (e.key === '+' || e.key === '=') {
    updateZoom(0.1);
  } else if (e.key === '-' || e.key === '_') {
    updateZoom(-0.1);
  } else if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
    e.preventDefault();
    undo();
  } else if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.shiftKey && e.key === 'Z'))) {
    e.preventDefault();
    redo();
  } else if (e.key === 'Escape') {
    setActiveTool('none');
  }
});

// ============================================================
// TOUCH SWIPE NAVIGATION
// ============================================================
let touchStartX = 0;
let touchStartY = 0;

viewport.addEventListener('touchstart', (e) => {
  if (currentTool !== 'none') return;
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });

viewport.addEventListener('touchend', (e) => {
  if (currentTool !== 'none') return;
  const touchEndX = e.changedTouches[0].clientX;
  const touchEndY = e.changedTouches[0].clientY;
  const diffX = touchStartX - touchEndX;
  const diffY = touchStartY - touchEndY;

  if (Math.abs(diffX) > 50 && Math.abs(diffX) > Math.abs(diffY)) {
    if (diffX > 0) nextSlide();
    else prevSlide();
  }
}, { passive: true });

// ============================================================
// FULLSCREEN
// ============================================================
async function toggleFullscreen() {
  const isMobile = window.innerWidth <= 768;
  
  if (!document.fullscreenElement) {
    try {
      // Request fullscreen
      await document.documentElement.requestFullscreen();
      
      // Add class for mobile rotation
      if (isMobile) {
        document.body.classList.add('fullscreen-active');
        
        // Try to lock orientation to landscape
        if (screen.orientation && screen.orientation.lock) {
          try {
            await screen.orientation.lock('landscape');
          } catch (err) {
            // Orientation lock not supported — CSS rotation will handle it
            console.log('Orientation lock not supported:', err);
          }
        }
      }
    } catch (err) {
      console.warn('Fullscreen failed:', err);
    }
  } else {
    // Exit fullscreen
    if (screen.orientation && screen.orientation.unlock) {
      try {
        screen.orientation.unlock();
      } catch (err) {
        // Ignore
      }
    }
    
    document.body.classList.remove('fullscreen-active');
    
    if (document.exitFullscreen) {
      await document.exitFullscreen();
    }
  }
}

document.getElementById('btnFullscreen').addEventListener('click', toggleFullscreen);

// ============================================================
// ZOOM
// ============================================================
function updateZoom(step) {
  currentZoom = Math.min(Math.max(0.75, currentZoom + step), 2.0);
  document.documentElement.style.setProperty('--slide-scale', currentZoom);
}

document.getElementById('btnZoomIn').addEventListener('click', () => updateZoom(0.1));
document.getElementById('btnZoomOut').addEventListener('click', () => updateZoom(-0.1));

// ============================================================
// DRAWING ENGINE
// ============================================================
function setActiveTool(tool) {
  currentTool = tool;

  const tools = ['Pen', 'Highlighter', 'Line', 'Rect', 'Circle', 'Triangle', 'Eraser'];
  tools.forEach(t => {
    const btn = document.getElementById('btn' + t);
    if (btn) btn.classList.toggle('active', t.toLowerCase() === tool);
  });

  if (tool === 'none') {
    drawCanvas.classList.remove('active-interactive');
  } else {
    drawCanvas.classList.add('active-interactive');
  }
}

document.getElementById('btnPen').addEventListener('click', () => setActiveTool(currentTool === 'pen' ? 'none' : 'pen'));
document.getElementById('btnHighlighter').addEventListener('click', () => setActiveTool(currentTool === 'highlighter' ? 'none' : 'highlighter'));
document.getElementById('btnLine').addEventListener('click', () => setActiveTool(currentTool === 'line' ? 'none' : 'line'));
document.getElementById('btnRect').addEventListener('click', () => setActiveTool(currentTool === 'rect' ? 'none' : 'rect'));
document.getElementById('btnCircle').addEventListener('click', () => setActiveTool(currentTool === 'circle' ? 'none' : 'circle'));
document.getElementById('btnTriangle').addEventListener('click', () => setActiveTool(currentTool === 'triangle' ? 'none' : 'triangle'));
document.getElementById('btnEraser').addEventListener('click', () => setActiveTool(currentTool === 'eraser' ? 'none' : 'eraser'));

// Color swatches
document.querySelectorAll('.color-swatch').forEach(swatch => {
  swatch.addEventListener('click', () => {
    document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
    swatch.classList.add('active');
    currentColor = swatch.getAttribute('data-color');
    if (currentTool === 'none' || currentTool === 'eraser') {
      setActiveTool('pen');
    }
  });
});

// Clear current slide
document.getElementById('btnClear').addEventListener('click', () => {
  saveHistory();
  ctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
  delete slideDrawings[currentPage];
  updateUndoRedoButtons();
});

// ============================================================
// POINTER COORDS (Mouse + Touch + Stylus)
// ============================================================
function getCoords(e) {
  const rect = drawCanvas.getBoundingClientRect();
  let clientX, clientY;

  if (e.touches && e.touches.length > 0) {
    clientX = e.touches[0].clientX;
    clientY = e.touches[0].clientY;
  } else if (e.changedTouches && e.changedTouches.length > 0) {
    clientX = e.changedTouches[0].clientX;
    clientY = e.changedTouches[0].clientY;
  } else {
    clientX = e.clientX;
    clientY = e.clientY;
  }

  return {
    x: clientX - rect.left,
    y: clientY - rect.top
  };
}

// ============================================================
// DRAWING EVENTS
// ============================================================
function applyToolSettings() {
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  if (currentTool === 'pen' || currentTool === 'line' || currentTool === 'rect' || currentTool === 'circle' || currentTool === 'triangle') {
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = currentColor;
    ctx.lineWidth = 3;
  } else if (currentTool === 'highlighter') {
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = currentColor + '55';
    ctx.lineWidth = 18;
  } else if (currentTool === 'eraser') {
    ctx.globalCompositeOperation = 'destination-out';
    ctx.lineWidth = 28;
  }
}

function startDraw(e) {
  if (currentTool === 'none') return;
  e.preventDefault();
  isDrawing = true;

  const pos = getCoords(e);
  startX = pos.x;
  startY = pos.y;

  // Snapshot for shape preview & undo
  snapshot = ctx.getImageData(0, 0, drawCanvas.width, drawCanvas.height);

  ctx.beginPath();
  ctx.moveTo(startX, startY);
  applyToolSettings();

  if (currentTool === 'pen' || currentTool === 'highlighter' || currentTool === 'eraser') {
    ctx.lineTo(startX, startY);
    ctx.stroke();
  }
}

function draw(e) {
  if (!isDrawing || currentTool === 'none') return;
  e.preventDefault();

  const pos = getCoords(e);

  if (currentTool === 'pen' || currentTool === 'highlighter' || currentTool === 'eraser') {
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
  } else {
    // Shape: restore snapshot & redraw
    ctx.putImageData(snapshot, 0, 0);
    drawShape(pos.x, pos.y);
  }
}

function drawShape(endX, endY) {
  ctx.beginPath();
  applyToolSettings();

  if (currentTool === 'line') {
    ctx.moveTo(startX, startY);
    ctx.lineTo(endX, endY);
    ctx.stroke();
  } else if (currentTool === 'rect') {
    ctx.strokeRect(startX, startY, endX - startX, endY - startY);
  } else if (currentTool === 'circle') {
    const radius = Math.sqrt(Math.pow(endX - startX, 2) + Math.pow(endY - startY, 2));
    ctx.arc(startX, startY, radius, 0, 2 * Math.PI);
    ctx.stroke();
  } else if (currentTool === 'triangle') {
    ctx.moveTo(startX, endY);
    ctx.lineTo((startX + endX) / 2, startY);
    ctx.lineTo(endX, endY);
    ctx.closePath();
    ctx.stroke();
  }
}

function stopDraw(e) {
  if (isDrawing) {
    isDrawing = false;
    saveHistory();
    saveSlideCanvas(currentPage);
    updateUndoRedoButtons();
  }
}

// MOUSE EVENTS
drawCanvas.addEventListener('mousedown', startDraw);
drawCanvas.addEventListener('mousemove', draw);
window.addEventListener('mouseup', stopDraw);

// TOUCH EVENTS
drawCanvas.addEventListener('touchstart', startDraw, { passive: false });
drawCanvas.addEventListener('touchmove', draw, { passive: false });
window.addEventListener('touchend', stopDraw);

// STYLUS EVENTS (Pointer Events — for tablets & smart boards)
drawCanvas.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'pen' || e.pointerType === 'mouse') return; // handled by mouse/touch
  startDraw(e);
});
drawCanvas.addEventListener('pointermove', (e) => {
  if (e.pointerType === 'pen') draw(e);
});

// ============================================================
// SAVE / RESTORE SLIDE DRAWINGS
// ============================================================
function saveSlideCanvas(slideNum) {
  slideDrawings[slideNum] = drawCanvas.toDataURL();
}

function restoreSlideCanvas(slideNum) {
  ctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
  if (slideDrawings[slideNum]) {
    const img = new Image();
    img.onload = () => {
      ctx.globalCompositeOperation = 'source-over';
      ctx.drawImage(img, 0, 0);
    };
    img.src = slideDrawings[slideNum];
  }
}

// ============================================================
// UNDO / REDO
// ============================================================
function saveHistory() {
  if (!slideHistory[currentPage]) {
    slideHistory[currentPage] = { stack: [], index: -1 };
  }
  const history = slideHistory[currentPage];
  const currentData = drawCanvas.toDataURL();

  // Trim forward history
  history.stack = history.stack.slice(0, history.index + 1);
  history.stack.push(currentData);

  // Limit to 20 states
  if (history.stack.length > 20) {
    history.stack.shift();
  } else {
    history.index++;
  }
}

function undo() {
  const history = slideHistory[currentPage];
  if (!history || history.index <= 0) return;
  history.index--;
  applyHistoryState(history.stack[history.index]);
  updateUndoRedoButtons();
}

function redo() {
  const history = slideHistory[currentPage];
  if (!history || history.index >= history.stack.length - 1) return;
  history.index++;
  applyHistoryState(history.stack[history.index]);
  updateUndoRedoButtons();
}

function applyHistoryState(dataUrl) {
  const img = new Image();
  img.onload = () => {
    ctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
    ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(img, 0, 0);
    saveSlideCanvas(currentPage);
  };
  img.src = dataUrl;
}

function updateUndoRedoButtons() {
  const history = slideHistory[currentPage];
  const btnUndo = document.getElementById('btnUndo');
  const btnRedo = document.getElementById('btnRedo');

  if (!history) {
    btnUndo.disabled = true;
    btnRedo.disabled = true;
    return;
  }

  btnUndo.disabled = history.index <= 0;
  btnRedo.disabled = history.index >= history.stack.length - 1;
}

document.getElementById('btnUndo').addEventListener('click', undo);
document.getElementById('btnRedo').addEventListener('click', redo);

// ============================================================
// DOWNLOAD ANNOTATED PNG
// ============================================================
document.getElementById('btnDownload').addEventListener('click', () => {
  // Create combined canvas
  const combined = document.createElement('canvas');
  combined.width = drawCanvas.width;
  combined.height = drawCanvas.height;
  const combinedCtx = combined.getContext('2d');

  // Draw PDF page
  combinedCtx.drawImage(pdfCanvas, 0, 0, combined.width, combined.height);
  // Draw annotations
  combinedCtx.drawImage(drawCanvas, 0, 0);

  // Download
  const link = document.createElement('a');
  link.download = `class-${classId}-ch${chapterId}-slide-${currentPage}.png`;
  link.href = combined.toDataURL('image/png');
  link.click();
});
// Handle fullscreen change (e.g., user presses ESC or system exits fullscreen)
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement) {
    document.body.classList.remove('fullscreen-active');
    if (screen.orientation && screen.orientation.unlock) {
      try {
        screen.orientation.unlock();
      } catch (err) {
        // Ignore
      }
    }
  }
});
// ============================================================
// INIT
// ============================================================
init();
</script>
</body>
</html>
